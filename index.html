<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Kantenhain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="underwater"></div>
<div id="hud">
  <div id="cross"></div>
  <div id="info"></div>
  <button id="menuBtn" aria-label="Menü">☰</button>
  <div id="stick"><div id="knob"></div></div>
  <div id="actions">
    <button id="placeBtn" aria-label="Block setzen"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 9v6M9 12h6"/></svg><span>Setzen</span></button>
    <button id="breakBtn" aria-label="Block abbauen"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M9 12h6"/></svg><span>Abbauen</span></button>
    <button id="jumpBtn" aria-label="Springen"><svg viewBox="0 0 24 24"><path d="M5 14l7-7 7 7M5 20l7-7 7 7"/></svg><span>Springen</span></button>
  </div>
  <div id="hotbar"></div>
  <div id="toast"></div>
</div>
<div id="labels"></div>
<div id="menu" hidden></div>
<div id="loading">Welt wird erzeugt …</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
